<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UINEEX AI - Reflex Sandbox v1.9</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .sidebar {
            width: 300px;
            background-color: #242424;
            border-right: 1px solid #333333;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .logo { font-size: 18px; font-weight: bold; color: #ffffff; text-align: center; letter-spacing: 1px; margin-bottom: 5px; }

        .panel-box {
            background-color: #2d2d2d;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3d3d3d;
        }

        .panel-box h3 { margin-top: 0; font-size: 10px; color: #b0b0b0; text-transform: uppercase; margin-bottom: 6px; }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #141414;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(15, 4.5vh);
            grid-template-rows: repeat(15, 4.5vh);
            gap: 2px;
            background-color: #262626;
            padding: 5px;
            border-radius: 8px;
            border: 2px solid #3d3d3d;
        }

        .cell {
            width: 4.5vh;
            height: 4.5vh;
            background-color: #1e1e1e;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2vh;
            cursor: pointer;
        }

        /* Цвета объектов */
        .wall { background-color: #613333 !important; border: 1px solid #854545; }
        .trap { background-color: #d67627 !important; border: 1px solid #f09343; position: relative; }
        .trap::after { content: "▲"; font-size: 10px; color: #000; position: absolute; bottom: 1px; }
        .portal-a { background-color: #3a8bba !important; border: 2px solid #4fc1ff; border-radius: 50%; box-shadow: 0 0 10px #4fc1ff; }
        .portal-b { background-color: #d68e27 !important; border: 2px solid #ff9d47; border-radius: 50%; box-shadow: 0 0 10px #ff9d47; }
        
        .bot { background-color: #3a6b8b !important; border-radius: 50%; z-index: 10; font-size: 2.5vh; }
        .target { background-color: #3a8b4a !important; border-radius: 4px; box-shadow: 0 0 8px #44a356; z-index: 5; }

        /* UI Элементы */
        .hp-display { color: #ff5555; font-size: 16px; font-weight: bold; margin-bottom: 5px; text-align: center; }
        
        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .tool-btn {
            background-color: #242424; border: 1px solid #444; padding: 6px;
            font-size: 10px; border-radius: 4px; text-align: center; cursor: pointer; color: #aaa;
        }
        .tool-btn.active { background-color: #4a4a4a; border-color: #fff; color: #fff; font-weight: bold; }

        .console-log {
            height: 100px; background-color: #111; border: 1px solid #333;
            border-radius: 4px; font-family: monospace; font-size: 10px; padding: 6px; overflow-y: auto; color: #888;
        }
        .log-warn { color: #cc9933; }
        .log-danger { color: #ff5555; font-weight: bold; }
        .log-success { color: #44a356; }

        button { color: white; border: none; border-radius: 6px; padding: 10px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 5px; }
        .btn-start { background-color: #3a8b4a; }
        .btn-stop { background-color: #8b3a3a; display: none; }

        #orientation-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #1a1a1a; z-index: 9999; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
    </style>
</head>
<body>

    <div id="orientation-overlay">
        <h2>🔄 Переверните телефон</h2>
        <p>Для игры нужен горизонтальный режим</p>
    </div>

    <div class="sidebar">
        <div class="logo">UIN-BOT v1.9</div>
        
        <div class="panel-box">
            <h3>❤️ Здоровье ИИ</h3>
            <div id="hpHearts" class="hp-display">❤️❤️❤️❤️❤️</div>
        </div>

        <div class="panel-box">
            <h3>📂 Карты</h3>
            <select id="mapPreset" onchange="loadPreset()">
                <option value="empty">Свой уровень</option>
                <option value="mines">Минное поле (6 мин)</option>
                <option value="portal_test">Тест Порталов</option>
            </select>
        </div>

        <div class="panel-box">
            <h3>🧱 Инструменты (ЛКМ)</h3>
            <div class="tool-grid">
                <div id="t-wall" class="tool-btn active" onclick="setTool('wall')">🧱 СТЕНА</div>
                <div id="t-trap" class="tool-btn" onclick="setTool('trap')">🔥 МИНА</div>
                <div id="t-portal-a" class="tool-btn" onclick="setTool('portal-a')">🔵 ПОРТАЛ A</div>
                <div id="t-portal-b" class="tool-btn" onclick="setTool('portal-b')">🟠 ПОРТАЛ B</div>
            </div>
            <div id="limitsInfo" style="font-size: 9px; color: #777; margin-top: 8px;">Мин: 0/6 | Порталов: 0/2</div>
        </div>

        <div class="panel-box">
            <h3>🎮 Управление</h3>
            <button id="startBtn" class="btn-start" onclick="startTest()">▶ ЗАПУСТИТЬ</button>
            <button id="stopBtn" class="btn-stop" onclick="stopTest()">🛑 СБРОСИТЬ</button>
            <button style="background: #444;" onclick="clearAll()">Очистить всё</button>
        </div>

        <div class="panel-box" style="flex:1;">
            <h3>📟 Монитор</h3>
            <div id="consoleLog" class="console-log"></div>
        </div>
    </div>

    <div class="main-container">
        <div id="grid-container"></div>
    </div>

    <script>
        const SIZE = 15;
        let grid = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
        let bot = { x: 1, y: 1 };
        let target = { x: 13, y: 13 };
        let hp = 5;
        let tool = 'wall';
        let isRunning = false;
        let simInterval = null;
        let aiMemory = {};
        
        // Позиции порталов
        let portalA = null;
        let portalB = null;

        document.addEventListener('contextmenu', e => e.preventDefault());

        function createGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            for(let y=0; y<SIZE; y++) {
                for(let x=0; x<SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.onmousedown = (e) => {
                        if(isRunning) return;
                        if(e.button === 0) editCell(x, y);
                        if(e.button === 2) deleteCell(x, y);
                    };
                    container.appendChild(cell);
                }
            }
            render();
        }

        function setTool(t) {
            tool = t;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('t-' + t).classList.add('active');
        }

        function editCell(x, y) {
            if((x===bot.x && y===bot.y) || (x===target.x && y===target.y)) return;
            
            // Если кликаем по существующему блоку — удаляем его
            if(grid[y][x] !== 0) {
                deleteCell(x, y);
                return;
            }

            if(tool === 'wall') grid[y][x] = 1;
            if(tool === 'trap') {
                if(countTraps() >= 6) { log("Лимит мин исчерпан!", "warn"); return; }
                grid[y][x] = 2;
            }
            if(tool === 'portal-a') {
                if(portalA) grid[portalA.y][portalA.x] = 0;
                portalA = {x, y};
                grid[y][x] = 3;
            }
            if(tool === 'portal-b') {
                if(portalB) grid[portalB.y][portalB.x] = 0;
                portalB = {x, y};
                grid[y][x] = 4;
            }
            render();
        }

        function deleteCell(x, y) {
            if(grid[y][x] === 3) portalA = null;
            if(grid[y][x] === 4) portalB = null;
            grid[y][x] = 0;
            render();
        }

        function countTraps() {
            return grid.flat().filter(c => c === 2).length;
        }

        function render() {
            const cells = document.querySelectorAll('.cell');
            const traps = countTraps();
            document.getElementById('limitsInfo').innerText = `Мин: ${traps}/6 | Порталов: ${(portalA?1:0)+(portalB?1:0)}/2`;
            
            // Рендер сердец
            let hText = "";
            for(let i=0; i<5; i++) hText += (i < hp) ? "❤️" : "🖤";
            document.getElementById('hpHearts').innerText = hText;

            cells.forEach((cell, i) => {
                const x = i % SIZE;
                const y = Math.floor(i / SIZE);
                cell.className = 'cell';
                cell.innerText = '';

                if(grid[y][x] === 1) cell.classList.add('wall');
                if(grid[y][x] === 2) cell.classList.add('trap');
                if(grid[y][x] === 3) cell.classList.add('portal-a');
                if(grid[y][x] === 4) cell.classList.add('portal-b');

                if(x === bot.x && y === bot.y) {
                    cell.classList.add('bot');
                    cell.innerText = hp > 0 ? "🤖" : "💥";
                }
                if(x === target.x && y === target.y) {
                    cell.classList.add('target');
                    cell.innerText = "🌀";
                }
            });
        }

        function log(msg, type="") {
            const l = document.getElementById('consoleLog');
            const e = document.createElement('div');
            if(type) e.className = 'log-' + type;
            e.innerText = "> " + msg;
            l.appendChild(e);
            l.scrollTop = l.scrollHeight;
        }

        function aiStep() {
            if(hp <= 0) return;

            const dirs = [{x:0,y:-1},{x:0,y:1},{x:-1,y:0},{x:1,y:0}];
            let best = null;
            let minScore = Infinity;

            for(let d of dirs) {
                let nx = bot.x + d.x, ny = bot.y + d.y;
                if(nx<0 || nx>=SIZE || ny<0 || ny>=SIZE) continue;

                let score = 0;
                
                // Стены
                if(grid[ny][nx] === 1) score += 1000;
                
                // Эвристика до цели
                let dist = Math.abs(target.x - nx) + Math.abs(target.y - ny);
                
                // ПРОВЕРКА ПОРТАЛА ДЛЯ ИИ
                if(grid[ny][nx] === 3 && portalB) {
                    // Если прыгнем в А, окажемся в Б. Считаем расстояние от Б.
                    dist = Math.abs(target.x - portalB.x) + Math.abs(target.y - portalB.y);
                }
                if(grid[ny][nx] === 4 && portalA) {
                    dist = Math.abs(target.x - portalA.x) + Math.abs(target.y - portalA.y);
                }

                score += dist;

                // Память
                if(aiMemory[`${nx},${ny}`]) score += aiMemory[`${nx},${ny}`] * 20;

                if(score < minScore) {
                    minScore = score;
                    best = {x: nx, y: ny};
                }
            }

            if(best) {
                if(grid[best.y][best.x] === 1) {
                    aiMemory[`${best.x},${best.y}`] = (aiMemory[`${best.x},${best.y}`]||0) + 10;
                } else {
                    bot.x = best.x; bot.y = best.y;
                    
                    // Телепортация
                    if(grid[bot.y][bot.x] === 3 && portalB) {
                        bot.x = portalB.x; bot.y = portalB.y;
                        log("Квантовый прыжок: А -> Б");
                    } else if(grid[bot.y][bot.x] === 4 && portalA) {
                        bot.x = portalA.x; bot.y = portalA.y;
                        log("Квантовый прыжок: Б -> А");
                    }

                    // Мины
                    if(grid[bot.y][bot.x] === 2) {
                        hp--;
                        log(`ПОДРЫВ! Опасно! HP: ${hp}`, "danger");
                        aiMemory[`${bot.x},${bot.y}`] = (aiMemory[`${bot.x},${bot.y}`]||0) + 50;
                        if(hp <= 0) {
                            clearInterval(simInterval);
                            log("РОБОТ УНИЧТОЖЕН", "danger");
                            setTimeout(() => stopTest(), 1000);
                        }
                    } else {
                        aiMemory[`${bot.x},${bot.y}`] = (aiMemory[`${bot.x},${bot.y}`]||0) + 1;
                    }
                }
            }
            render();

            if(bot.x === target.x && bot.y === target.y) {
                clearInterval(simInterval);
                log("ИСПЫТАНИЕ ПРОЙДЕНО!", "success");
                alert("Победа!");
                clearAll();
            }
        }

        function startTest() {
            isRunning = true;
            hp = 5;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
            simInterval = setInterval(aiStep, 150);
        }

        function stopTest() {
            clearInterval(simInterval);
            isRunning = false;
            bot = {x: 1, y: 1};
            hp = 5;
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            render();
        }

        function clearAll() {
            grid = Array(SIZE).fill().map(() => Array(SIZE).fill(0));
            portalA = null; portalB = null;
            aiMemory = {};
            stopTest();
        }

        function loadPreset() {
            const p = document.getElementById('mapPreset').value;
            clearAll();
            if(p === 'mines') {
                for(let i=0; i<6; i++) {
                    let rx = Math.floor(Math.random()*13)+1;
                    let ry = Math.floor(Math.random()*13)+1;
                    grid[ry][rx] = 2;
                }
                log("Размещено 6 случайных мин");
            }
            if(p === 'portal_test') {
                portalA = {x: 3, y: 3}; grid[3][3] = 3;
                portalB = {x: 11, y: 11}; grid[11][11] = 4;
                for(let x=0; x<15; x++) grid[7][x] = 1;
                grid[7][7] = 0; // проход
                log("Пресет порталов загружен");
            }
            render();
        }

        createGrid();
        window.addEventListener('resize', () => {
            if(window.innerWidth < window.innerHeight) document.getElementById('orientation-overlay').style.display = 'flex';
            else document.getElementById('orientation-overlay').style.display = 'none';
        });
    </script>
</body>
</html>
